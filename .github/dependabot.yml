# Weekly pull requests for newer dependency versions (docs/adr/0023). Each goes through CI like
# any other pull request and is merged by hand after reading its release notes (runbook,
# "Dependency update pull requests").
#
# Not here: container images (docker-compose.yml, the Kubernetes manifests, the Dockerfile's
# Python and uv). Each is pinned in several places that must move together, which Dependabot
# can't do, and a data store's upgrade needs its own plan.
version: 2
updates:
  # Python: uv.lock, for every package in the workspace.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00" # after the weekly audit at 06:17
      timezone: Etc/UTC
    cooldown:
      default-days: 7 # a release a week old, not one published minutes ago
    groups:
      python:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # The website: web/package-lock.json.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "07:00" # after the weekly audit at 06:17
      timezone: Etc/UTC
    cooldown:
      default-days: 7 # a release a week old, not one published minutes ago
    groups:
      website:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Workflow actions, pinned to commit SHAs with the version in a comment: both are updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00" # after the weekly audit at 06:17
      timezone: Etc/UTC
    cooldown:
      default-days: 7 # a release a week old, not one published minutes ago
    groups:
      actions:
        patterns: ["*"]

  # Terraform providers: each root module's .terraform.lock.hcl.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/production
      - /infra/terraform/tools/capacity-report
    schedule:
      interval: weekly
      day: monday
      time: "07:00" # after the weekly audit at 06:17
      timezone: Etc/UTC
    cooldown:
      default-days: 7 # a release a week old, not one published minutes ago
    groups:
      terraform-providers:
        patterns: ["*"]
