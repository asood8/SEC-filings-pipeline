name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Started early so the images pull while the other steps run; tests wait for health.
      - name: Start backing services
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d postgres valkey redpanda mongodb

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as local commits: file hygiene, ruff, mypy, and the lockfile check.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        env:
          REQUIRE_SERVICES: "1"  # integration tests fail instead of skipping
        run: |
          docker compose up -d --wait postgres valkey redpanda mongodb
          make test

  web:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The API's OpenAPI schema is generated from Python, for the types check below.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: make web-install

      - name: API types match the API
        run: |
          make web-types
          git diff --exit-code web/src/api/schema.d.ts

      - name: Lint, type-check, test, build
        run: make web-check
