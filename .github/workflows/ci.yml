name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1 # exact: setup-uv publishes no "v10" tag
        with:
          enable-cache: true

      # Started early so the images pull while the other steps run; tests wait for health.
      - name: Start backing services
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d postgres valkey redpanda mongodb

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as local commits: file hygiene, shellcheck, actionlint, ruff, mypy, and the
      # lockfile check.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        env:
          REQUIRE_SERVICES: "1"  # integration tests fail instead of skipping
        run: |
          docker compose up -d --wait postgres valkey redpanda mongodb
          make test

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 80 postgres valkey redpanda mongodb

  web:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The API's OpenAPI schema is generated from Python, for the types check below.
      - uses: astral-sh/setup-uv@v10.3.1 # exact: setup-uv publishes no "v10" tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: make web-install

      - name: API types match the API
        run: |
          make web-types
          git diff --exit-code web/src/api/schema.d.ts

      - name: Lint, type-check, test, build
        run: make web-check

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The same Terraform release as development (ADR-0018). No credentials and no accounts:
      # the tests run against mock providers, and nothing is planned against a real one.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # The providers the lock file names (make tf-check keeps them in this directory).
      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('infra/terraform/envs/production/.terraform.lock.hcl') }}

      # Format check, `init -backend=false` with the committed lock file, validate, the tests,
      # and the free-tier resource allowlist.
      - name: Format, validate, test, free-tier allowlist
        run: make tf-check

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The manifest rules are pytest tests (tests/test_k8s_manifests.py).
      - uses: astral-sh/setup-uv@v10.3.1 # exact: setup-uv publishes no "v10" tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Pinned versions, checked against SHA-256 sums in the script.
      - name: Install kubectl, kubeconform, and kubeseal
        run: make k8s-tools

      - name: Cache Kubernetes JSON schemas
        uses: actions/cache@v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-${{ hashFiles('scripts/check-k8s.sh') }}

      # Renders every Kustomize directory and validates it; no cluster involved.
      - name: Render and validate
        run: make k8s-check
