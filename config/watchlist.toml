# Companies discovery polls on EDGAR: the Fortune 100 (the 2026 list, ranked by 2025 revenue)
# that trade on a market, plus 7 widely followed companies below the top 100 (Adobe, AMD,
# Mastercard, McDonald's, Netflix, Salesforce, Visa). They file Form 4s (insider trades) and 8-Ks
# (major events) often, so the pipeline always has activity.
#
# Not here: the 7 customer-owned insurers on the list (State Farm, New York Life, Nationwide,
# USAA, TIAA, Liberty Mutual, MassMutual), which have no stock and so no insider trades, and
# Publix, which has stock but no ticker.
#
# After editing, run `uv run filings-discovery load-companies`; it reports any unknown ticker.
