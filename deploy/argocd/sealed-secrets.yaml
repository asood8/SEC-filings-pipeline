# The Sealed Secrets controller, managed like the application, so upgrading it is a commit. It
# follows main, not the production branch that the application follows (filings.yaml): it runs
# none of our images, and on a new cluster it must be running before anyone can seal the Secrets
# the application needs, so it can't wait for the application's first deploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: filings
  source:
    repoURL: https://github.com/asood8/SEC-filings-pipeline.git
    targetRevision: main
    path: deploy/k8s/platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5
