# The pipeline's alert rules (brief §7), as Grafana-managed rules in Grafana's provisioning format.
# The local viewer (`make obs-up`) loads this file when it starts; Terraform provisions the same
# rules into Grafana Cloud (Phase 7). See docs/adr/0016-observability.md.
#
# Kept portable on purpose:
# - Queries are plain PromQL over the metrics in libs/common/src/filings_common/metrics.py.
# - `datasourceUid: prometheus` is the local viewer's Prometheus, the only value that differs per
#   environment: Terraform swaps in Grafana Cloud's (grafanacloud-prom by default).
# - Annotations use {{ .Labels.x }}, not {{ $labels.x }}: Grafana reads $name in provisioning
#   files as an environment variable.
# - No contact points or notification policies: they hold secrets (a Discord webhook) and differ
#   per environment, so they live with each environment's configuration.
#
# Each rule's query A returns one series per alert instance; C is the threshold that fires it.
apiVersion: 1

groups:
  - orgId: 1
    name: pipeline
    folder: Filingwire
    interval: 1m
    rules:
      # Discovery found nothing, or nothing made it through to a summary, in a day with SEC
      # filings. EDGAR accepts filings on weekdays, 6:00 to 22:00 US Eastern. The rule only checks
      # from Tuesday 12:00 to Saturday 12:00 UTC, so every 24-hour window it looks at covers at
      # least 14 of those weekday filing hours (US holidays still fire it). Discovery is a
      # short-lived job whose runs each have their own series, hence max_over_time (see
      # metrics.py); no discovery run at all counts as zero.
      - uid: filings-no-new-filings
        title: No new filings in 24 hours
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  label_replace(
                    sum(max_over_time(filings_discovered_total[24h])) or vector(0),
                    "stage", "discovered", "", ""
                  )
                  or
                  label_replace(
                    sum(increase(filings_ready_total[24h])) or vector(0),
                    "stage", "summarized", "", ""
                  )
                )
                and on ()
                (
                    (day_of_week() == 2 and hour() >= 12)
                  or (day_of_week() >= 3 and day_of_week() <= 5)
                  or (day_of_week() == 6 and hour() < 12)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # Outside the checked hours the query returns nothing, which is fine.
        noDataState: OK
        execErrState: Error
        for: 15m
        dashboardUid: filings-pipeline
        panelId: 7
        labels:
          severity: warning
        annotations:
          summary: No filings {{ .Labels.stage }} in the last 24 hours
          description: >-
            No filing was {{ .Labels.stage }} in the last 24 hours, a period with SEC filing hours.
            "discovered": check the discovery job's runs and logs (SEC errors, the watchlist).
            "summarized" alone: filings are discovered but stuck after that; check the outbox
            relay, the consumers' lag, and the dead-letter topics.

      # Messages a stage gave up on (retries ran out, or a permanent error). Nothing consumes the
      # dead-letter topics, and they are kept indefinitely (retention.ms=-1, like the pipeline
      # topics), so this fires until an operator trims the topic after fixing the cause and
      # replaying the filings: rpk topic trim-prefix <topic> --offset end.
      - uid: filings-dlq-not-empty
        title: Dead-letter topic not empty
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: max by (messaging_destination_name) (filings_dlq_depth)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # No consumer is measuring (they are all stopped): "not reporting", below, covers that.
        noDataState: OK
        execErrState: Error
        for: 0s
        dashboardUid: filings-pipeline
        panelId: 13
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.messaging_destination_name }} holds dead letters"
          description: >-
            {{ .Labels.messaging_destination_name }} holds {{ .Values.A.Value }} message(s) that
            a pipeline stage could not handle. The consumer's log line "dead-lettering ..." has
            the error and the trace ID; dead letters keep their trace headers. Fix the cause,
            replay the filings (filings-replay), then empty the topic: rpk topic trim-prefix
            {{ .Labels.messaging_destination_name }} --offset end

      # A consumer group far behind its topic for a while: a stage is stuck, failing, or too slow
      # (a replay of many 8-Ks through the local LLM can trigger it on purpose). Normal traffic is
      # a few filings per discovery run.
      - uid: filings-consumer-lag-high
        title: Consumer lag high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              # Per partition first (max): during a rebalance two consumers may both report one.
              expr: |
                sum by (messaging_consumer_group_name, messaging_destination_name) (
                  max by (
                    messaging_consumer_group_name,
                    messaging_destination_name,
                    messaging_destination_partition_id
                  ) (filings_consumer_lag)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [100] }
        noDataState: OK
        execErrState: Error
        for: 15m
        dashboardUid: filings-pipeline
        panelId: 10
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ .Labels.messaging_consumer_group_name }} is {{ .Values.A.Value }} messages behind
            on {{ .Labels.messaging_destination_name }}
          description: >-
            The consumer group has been more than 100 messages behind for 15 minutes. Check the
            stage's logs for repeated retries, its dependencies (the LLM for the summarizer), and
            the "process <topic>" spans for slow handling.

      # Not in the brief's list, but the lag and dead-letter rules can't see a consumer that has
      # stopped: its gauges just disappear. Fires for a long-running service that reported metrics
      # in the last day but not in the last 10 minutes (every process exports once a minute, and
      # target_info is written with each export). Short-lived jobs are excluded.
      - uid: filings-service-not-reporting
        title: Pipeline service not reporting
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                count by (job) (
                  last_over_time(
                    target_info{job=~"(.+/)?filings-(outbox-relay|parser|summarizer|notifier|api)"}[1d]
                  )
                )
                unless
                count by (job) (last_over_time(target_info[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ .Labels.job }} stopped reporting metrics"
          description: >-
            {{ .Labels.job }} exported metrics in the last day but not in the last 10 minutes: it
            is down, crash-looping, or can't reach the telemetry endpoint. Stopping a service on
            purpose also fires this, for up to a day.

      # R2 bills past its free tier and has no spending cap, so this fires past half of any monthly
      # allowance: storage, Class A, or Class B operations (filings_common.r2_usage). The daily
      # filings-r2-usage job measures them with Cloudflare's own numbers; max_over_time keeps its
      # once-a-day value in view.
      - uid: filings-r2-free-tier-half-used
        title: R2 free tier half used
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: max by (filings_r2_measure) (max_over_time(filings_r2_free_tier_used[26h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
        noDataState: OK
        execErrState: Error
        for: 0s
        dashboardUid: filings-pipeline
        panelId: 31
        labels:
          severity: warning
        annotations:
          summary: R2 {{ .Labels.filings_r2_measure }} is past half of its free tier
          description: >-
            Over half of R2's monthly free {{ .Labels.filings_r2_measure }} allowance is used, and
            R2 bills past all of it. The filings-r2-usage job's log has the numbers. See the
            runbook, "Alert: R2 free tier half used", before it reaches 100%.

      # The check above can only fire if its job runs: this one fires when filings-r2-usage
      # reported in the last week but not in the last 50 hours (it runs daily). Never having run
      # (the local viewer, a new cluster) doesn't fire it.
      - uid: filings-r2-usage-not-measured
        title: R2 usage not measured
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                count by (job) (last_over_time(target_info{job=~"(.+/)?filings-r2-usage"}[7d]))
                unless
                count by (job) (last_over_time(target_info{job=~"(.+/)?filings-r2-usage"}[50h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: R2's free-tier use hasn't been measured in two days
          description: >-
            The daily filings-r2-usage job hasn't reported for 50 hours, so the free-tier alert
            can't fire. Check the r2-usage CronJob's runs and logs (its token, Cloudflare's
            analytics API).

      # Oracle bills a Pay As You Go account past Always Free and has no spending cap; its budget
      # alert is evaluated once a day on day-old costs. The daily filings-oci-inventory job lists
      # what exists instead (filings_common.oci_inventory); max_over_time keeps its once-a-day
      # values in view. Anything beyond what the project creates fires this.
      - uid: filings-oci-unexpected-resources
        title: Oracle account has unexpected resources
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: max(max_over_time(filings_oci_resources_unexpected[26h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: The Oracle account holds something the project doesn't create
          description: >-
            The daily filings-oci-inventory job found resources beyond the one VM, its two volumes
            and its network: another VM or volume, or a kind the project doesn't use. On a Pay As
            You Go account that can cost money, and Oracle's own budget alert comes a day later.
            The job's log names the kinds. See the runbook, "Guardrails against charges": find it
            in the console and remove it, or run make oci-stop.

      # The quota policy and the budget are what keep the account free; only an administrator
      # can remove them, so their absence means a mistake or a stolen login.
      - uid: filings-oci-guardrail-missing
        title: Oracle guardrail missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: max(max_over_time(filings_oci_guardrails_missing[26h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: A spending guardrail of the Oracle account is missing or weakened
          description: >-
            The quota policy filings-always-free or the budget filings-stay-free is gone, inactive
            or changed, or the tenancy is subscribed to a second region. Nobody should change
            these: if you didn't, treat the account as broken into (change the password, check the
            API keys). The job's log says which. Restore them with make tf-plan and an apply.

      # The budget's own figure for the month, read by the same job: a second way to hear of a
      # charge, besides Oracle's email.
      - uid: filings-oci-spend
        title: Oracle reports spend
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: max(max_over_time(filings_oci_budget_spend[26h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: Oracle says money was spent this month
          description: >-
            The budget filings-stay-free reports spend above zero, and everything should be Always
            Free. Billing & Cost Management, Cost Analysis, grouped by service, shows what it is.
            See the runbook, "Guardrails against charges": remove it, or run make oci-stop, or
            make oci-off.

      # The three checks above can only fire if their job runs: this one fires when
      # filings-oci-inventory reported in the last week but not in the last 50 hours.
      - uid: filings-oci-not-checked
        title: Oracle account not checked
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                count by (job) (last_over_time(target_info{job=~"(.+/)?filings-oci-inventory"}[7d]))
                unless
                count by (job) (last_over_time(target_info{job=~"(.+/)?filings-oci-inventory"}[50h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: The Oracle account hasn't been checked in two days
          description: >-
            The daily filings-oci-inventory job hasn't reported for 50 hours, so the alerts on
            unexpected resources, missing guardrails and spend can't fire. Check the oci-inventory
            CronJob's runs and logs (its key, Oracle's API). Run make oci-status meanwhile.

      # The nightly backup (03:30 UTC) reports its dump's size only after the upload to R2
      # succeeded (filings-backup-report), so a night without a report is a failed or skipped
      # backup. Fires when a backup was reported in the last 8 days but none in the last 28 hours:
      # a day plus room for a late or retried run. Never having run (the local viewer, a new
      # cluster) doesn't fire it.
      - uid: filings-backup-missing
        title: Postgres backup missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                count by (job) (last_over_time(filings_backup_size_bytes[8d]))
                unless
                count by (job) (last_over_time(filings_backup_size_bytes[28h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        dashboardUid: filings-pipeline
        panelId: 32
        labels:
          severity: warning
        annotations:
          summary: No Postgres backup in over a day
          description: >-
            The nightly backup hasn't reported a dump uploaded to R2 for 28 hours. Older backups
            are still there (kept 30 days). See the runbook, "Alert: Postgres backup missing".

      # A backup that "works" but holds the wrong thing: the newest dump is under half the size of
      # the largest in the past 8 days. The database only grows (filings are never deleted), so
      # this means something like a database recreated empty after its volume was lost. Left
      # alone, the nightly empty dumps would look healthy while the bucket's 30-day lifecycle rule
      # deletes the last good one. Each run is its own series; runs are a day apart, so the
      # 20-hour window holds only the newest (the alert then clears itself until the next run).
      - uid: filings-backup-shrank
        title: Postgres backup shrank
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                min by (job) (last_over_time(filings_backup_size_bytes[20h]))
                / on (job)
                max by (job) (max_over_time(filings_backup_size_bytes[8d]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.5] }
        noDataState: OK
        execErrState: Error
        for: 0s
        dashboardUid: filings-pipeline
        panelId: 32
        labels:
          severity: critical
        annotations:
          summary: The newest Postgres backup is under half the usual size
          description: >-
            Last night's dump is less than half the size of the largest in the past week. Check
            that the database still holds its data before the older, good backups expire. See the
            runbook, "Alert: Postgres backup shrank".

      # The nightly transcript job (call-transcripts, ADR-0022) counts the companies whose latest
      # earnings 8-K is three weeks old with no transcript of that call stored. Companies post one
      # within days, so a count above zero means a source broke: the site moved its transcripts
      # or changed their format (or a company stopped posting them). The last 26 hours hold the
      # newest nightly count only.
      - uid: filings-transcripts-overdue
        title: Earnings-call transcript overdue
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |
                max(last_over_time(filings_transcripts_overdue[26h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        dashboardUid: filings-pipeline
        panelId: 33
        labels:
          severity: warning
        annotations:
          summary: A company's earnings-call transcript is three weeks overdue
          description: >-
            The call-transcripts job found no transcript for a recent earnings call. The job's
            log names the companies. See the runbook, "Alert: Earnings-call transcript overdue".
