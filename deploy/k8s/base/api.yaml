# The public API (FastAPI). Reached only through Cloudflare Tunnel: cloudflared forwards the
# public hostname to this Service, and the api NetworkPolicy admits nothing else.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Stateless: rate limits and the cache are in Valkey, sessions in Postgres. The production
  # overlay sets the replica count.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: filings-api # default command: uvicorn on port 8000 (ADR-0014)
          envFrom:
            - configMapRef:
                name: filings-config
            - secretRef:
                name: postgres
          env:
            # Assembled from the postgres Secret and the config, so the password has one source.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          ports:
            - name: http
              containerPort: 8000
          # Ready only while Postgres answers (GET /readyz gives up after 2 s), so no traffic
          # reaches a replica without its database and a rollout waits for the new one. Alive
          # whenever the process answers: a database outage is no reason to restart the API.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            # CPU requests also weight how busy cores are shared. While the LLM summarizes an
            # 8-K it keeps both cores busy for minutes; this keeps the API responsive meanwhile.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
