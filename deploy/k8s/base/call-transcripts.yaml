# Earnings-call Q&A from the companies' own transcripts (ADR-0022), each night in two steps:
# - fetch: the sources in config/transcript_sources.toml are checked for the transcripts of recent
#   earnings calls; new ones go to MongoDB (text) and Postgres (a row). No SEC requests: call
#   dates come from the 8-Ks discovery already stored. Sites get an honest User-Agent, robots.txt
#   is honored, and requests to one site are a second apart: a minute or two.
# - summarize: each new call's Q&A, one exchange at a time through the same LLM chain as the
#   summarizer (the local model, then Gemini): about 10 exchanges of half a minute to a minute
#   each on the laptop, so up to a few hours on an earnings-season night. It stops starting calls
#   after 3 hours; the rest wait for the next night.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: call-transcripts
spec:
  # US companies post a transcript hours to days after a call; a nightly look is soon enough.
  schedule: "40 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a site that failed tonight is tried again tomorrow, and re-runs are idempotent.
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: call-transcripts
            app.kubernetes.io/component: pipeline
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 45
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: filings-discovery
              command: ["filings-discovery", "fetch-transcripts"]
              envFrom:
                - configMapRef:
                    name: filings-config
                - secretRef:
                    name: postgres
                - secretRef:
                    name: mongodb
              env:
                - name: DATABASE_URL
                  value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  # Measured: 108 MiB at most reading the largest real transcript (a 1.3 MB PDF);
                  # documents are capped at 4 MB.
                  memory: 160Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: summarize
              image: filings-summarizer
              command: ["filings-summarize-calls"]
              envFrom:
                - configMapRef:
                    name: filings-config
                - secretRef:
                    name: postgres
                - secretRef:
                    name: mongodb
                # Optional, as for the summarizer: without it, only the local model writes.
                - secretRef:
                    name: gemini
                    optional: true
              env:
                - name: DATABASE_URL
                  value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  # The model runs in the llm pod; this only holds one transcript and the prompts.
                  memory: 160Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
