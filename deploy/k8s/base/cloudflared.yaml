# Cloudflare Tunnel: an outbound connection from the cluster to Cloudflare, so the API is served
# over HTTPS on the public hostname with no open ports on the VM and no ingress controller.
# The tunnel is remotely managed: its token (cloudflared Secret) identifies it, and its routing
# rule, <public API hostname> -> http://api.filings.svc.cluster.local:8000, is part of the
# tunnel's configuration at Cloudflare (Terraform, Phase 7) alongside the DNS record.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # The production overlay sets the count (Cloudflare suggests more than one for resilience;
  # on one node a second copy adds little).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: edge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the image's nonroot user
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          # The image's entrypoint is `cloudflared --no-autoupdate`. `tunnel run` reads the
          # token from TUNNEL_TOKEN.
          args: ["tunnel", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 once the tunnel has a live connection to Cloudflare.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
