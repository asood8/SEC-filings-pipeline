# The embedding model behind semantic search: llama.cpp's server with nomic-embed-text v1.5, the
# same model and 16-bit weights as Ollama's nomic-embed-text:v1.5 in development. The summarizer
# embeds each summary and the API embeds search queries (EMBEDDING_BASE_URL). Its own server and
# volume, so it can restart without the LLM; it needs only 0.4 GiB (measured peak 396 MiB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-models
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
spec:
  selector:
    app.kubernetes.io/name: embeddings
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddings
        app.kubernetes.io/component: llm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-model
          image: ghcr.io/ggml-org/llama.cpp:server-b11434
          command: ["sh", "/scripts/fetch-model.sh"]
          env:
            - name: MODEL_FILE
              value: nomic-embed-text-v1.5.f16.gguf
            - name: MODEL_URL
              value: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/0188c9bf409793f810680a5a431e7b899c46104c/nomic-embed-text-v1.5.f16.gguf
            - name: MODEL_SHA256
              value: f7af6f66802f4df86eda10fe9bbcfc75c39562bed48ef6ace719a251cf1c2fdb
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b11434
          args:
            - --model
            - /models/nomic-embed-text-v1.5.f16.gguf
            - --alias
            - nomic-embed-text-v1.5
            - --embeddings
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # The model's 2,048-token context. An embedding input must fit in one batch, so the
            # batch sizes match it.
            - --ctx-size
            - "2048"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --parallel
            - "1"
            - --threads
            - "1"
            - --load-mode
            - dio
            - --no-ui
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: embedding-models
        - name: scripts
          configMap:
            name: model-fetch
        - name: tmp
          emptyDir: {}
