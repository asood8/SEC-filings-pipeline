# Who may connect to whom inside the namespace (k3s enforces NetworkPolicies with its embedded
# kube-router controller). Every pod starts with no inbound connections; each policy below opens
# one port to the pods that need it, by their app.kubernetes.io/name label. Traffic from the node
# itself, such as the kubelet's health probes, is always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api
                  - outbox-relay
                  - parser
                  - summarizer
                  - notifier
                  - discovery
                  - load-companies
                  - migrate
                  - postgres-backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [outbox-relay, parser, summarizer, notifier]
      ports:
        - port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                # The SEC token bucket (discovery, load-companies), the Gemini pacing bucket
                # (summarizer), and the API's rate limits and cache.
                values: [api, discovery, load-companies, summarizer]
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: summarizer
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embeddings
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                # Documents (summarizer) and search queries (api).
                values: [summarizer, api]
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress"]
  ingress:
    # Only the tunnel. This is what makes API_TRUST_PROXY_HEADERS=true safe: no other client can
    # reach the API to forge CF-Connecting-IP.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: ["Ingress"]
  ingress:
    # Any pod in the namespace may send telemetry.
    - from:
        - podSelector: {}
      ports:
        - port: 4318
---
# The data stores never need the internet: they may reach DNS and pods in this namespace only,
# so a compromised database or broker can't send data out (this also keeps Redpanda from
# phoning home, besides enable_metrics_reporter: false).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres, redpanda, valkey]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
