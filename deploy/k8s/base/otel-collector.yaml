# OpenTelemetry Collector: the services send traces and metrics here over OTLP, and it forwards
# them to Grafana Cloud's free tier, so no observability backend runs on the VM. The contrib
# distribution, for its basicauth extension (Grafana Cloud's OTLP authentication).
#
# Its binary is about 400 MB. On a cold start (after a reboot, nothing in page cache) the pages it
# reads are charged to the container: measured at 0.5 CPU, it was healthy after 5 s with a 256 MiB
# limit (143 MiB used), but took 21 s at 160 MiB and 44 s at 160 MiB and 0.25 CPU, reclaiming its
# own code as it ran. Warm, it settles at about 45 MiB.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: observability
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's user
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          envFrom:
            - secretRef:
                name: grafana-cloud
          env:
            # Go's garbage collector works to stay under this, below the container's limit.
            - name: GOMEMLIMIT
              value: 128MiB
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
