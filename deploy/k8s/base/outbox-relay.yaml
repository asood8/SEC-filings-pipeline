# The outbox relay: publishes outbox rows to Redpanda in id order, and creates missing topics at
# startup. It runs from the discovery image (ADR-0014).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
spec:
  # Exactly one: a second relay would not publish the same row twice (SKIP LOCKED), but could
  # publish rows out of order. Recreate, so an update never runs two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
        app.kubernetes.io/component: pipeline
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-relay
          image: filings-discovery
          command: ["filings-outbox-relay"]
          envFrom:
            - configMapRef:
                name: filings-config
            - secretRef:
                name: postgres
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 144Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
