# The parser: consumes filings.discovered, reads raw filings from R2, writes MongoDB and Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
spec:
  # One consumer in its group is plenty at this volume. Up to three could share the work (topics
  # have three partitions); the production overlay sets the count.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parser
        app.kubernetes.io/component: pipeline
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parser
          image: filings-parser
          envFrom:
            - configMapRef:
                name: filings-config
            - secretRef:
                name: postgres
            - secretRef:
                name: mongodb
            - secretRef:
                name: r2-raw-filings
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
