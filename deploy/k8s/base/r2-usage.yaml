# Daily check of R2's free tier (filings-r2-usage, libs/common/src/filings_common/r2_usage.py):
# reads Cloudflare's usage numbers with a token that can only read analytics, and exports the
# fraction of each monthly allowance used. R2 bills past its free tier and has no spending cap, so
# the "R2 free tier half used" alert (deploy/grafana) fires past half, and "R2 usage not measured"
# if this job stops reporting. It makes one HTTPS request to api.cloudflare.com, and none to R2.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: r2-usage
spec:
  # Clear of the backup (03:30) and load-companies (05:17), so at most one daily job overlaps
  # discovery (the VM's memory budget counts two jobs at once).
  schedule: "47 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: r2-usage
            app.kubernetes.io/component: operations
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Time for the final telemetry export, as for discovery.
          terminationGracePeriodSeconds: 45
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: r2-usage
              # Any service image has filings-common's commands; discovery's is the jobs' image.
              image: filings-discovery
              command: ["filings-r2-usage"]
              envFrom:
                - configMapRef:
                    name: filings-config
                - secretRef:
                    name: cloudflare-analytics
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
