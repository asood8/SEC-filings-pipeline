# Redpanda, single node, tuned small: one core (--smp 1), 1 GiB of memory for Redpanda itself
# (its recommended minimum per core), and --overprovisioned so it shares the CPU politely instead
# of busy-polling. Topics are created by the outbox relay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda
data:
  # Node configuration. rpk adds the command-line flags to it at startup, so the init container
  # copies it into a writable directory. Without a file, rpk would write a developer-mode config
  # that acknowledges writes before they reach the disk.
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      seed_servers: []
      empty_seed_starts_cluster: true
      rpc_server:
        address: 0.0.0.0
        port: 33145
      kafka_api:
        - name: internal
          address: 0.0.0.0
          port: 9092
      admin:
        - address: 0.0.0.0
          port: 9644
      developer_mode: false
    rpk:
      overprovisioned: true
      coredump_dir: /var/lib/redpanda/coredump
  # Cluster properties, applied when the cluster is first created (later changes need
  # `rpk cluster config set`). Redpanda goes read-only below storage_min_free_bytes, 5 GiB by
  # default, which is more than this small volume needs.
  .bootstrap.yaml: |
    auto_create_topics_enabled: false
    enable_metrics_reporter: false
    storage_min_free_bytes: 1073741824
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  # Headless, so the broker's advertised address (redpanda-0.redpanda...) resolves to the pod.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  # One broker: topics have one replica (KAFKA_TOPIC_REPLICATION_FACTOR=1).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: broker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the image's redpanda user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config
          image: redpandadata/redpanda:v26.2.3
          command: ["cp", "/config/redpanda.yaml", "/config/.bootstrap.yaml", "/etc/redpanda/"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: etc
              mountPath: /etc/redpanda
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.3
          command: ["rpk", "redpanda", "start"]
          args:
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --overprovisioned
            - --advertise-kafka-addr=internal://$(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:9092
            - --advertise-rpc-addr=$(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:33145
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # Redpanda's 1 GiB plus room for what it allocates outside that (the Redpanda Helm
            # chart gives it 80% of the container's limit).
            limits:
              cpu: "1"
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: etc
              mountPath: /etc/redpanda
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: redpanda
        - name: etc
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi
