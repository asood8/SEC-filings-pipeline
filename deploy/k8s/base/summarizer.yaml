# The summarizer: consumes filings.parsed; Form 4s get a template, 8-Ks the LLM (llama.cpp first,
# then Gemini), and every summary an embedding.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer
spec:
  # Exactly one: the local LLM serves one request at a time, so a second summarizer would only
  # queue behind the first (and double the Gemini fallback's request rate during an outage).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: summarizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summarizer
        app.kubernetes.io/component: pipeline
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # SIGTERM stops the loop; then the process flushes its last spans and metrics, which can take
      # up to 30 s with the collector unreachable (ADR-0016). The default 30 s grace is too tight.
      # A summary in progress isn't waited for (it can take minutes): the filing is redelivered.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: summarizer
          image: filings-summarizer
          envFrom:
            - configMapRef:
                name: filings-config
            - secretRef:
                name: postgres
            - secretRef:
                name: mongodb
            # Optional: without a Gemini key, 8-Ks are summarized by the local model only.
            - secretRef:
                name: gemini
                optional: true
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          # The loop keeps a heartbeat file in /tmp; the check fails once it is overdue, i.e. the
          # loop hangs (filings_common.health, ADR-0017). Until the first beat, the startup probe
          # allows 5 minutes. Before each attempt at a filing the heartbeat allows for every LLM
          # timeout, so a long 8-K summary is never mistaken for a hang.
          startupProbe:
            exec:
              command: ["filings-healthcheck", "filings-summarizer"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["filings-healthcheck", "filings-summarizer"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
