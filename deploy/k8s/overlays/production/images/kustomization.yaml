# The service images production runs: built for linux/amd64 and linux/arm64 by
# .github/workflows/images.yml and pushed to GHCR. All five come from the same commit and share
# its tag, sha-<short commit SHA>.
#
# CI writes this file. After a push to main builds new images and CI passes, its deploy job sets
# the tags with `kustomize edit set image` and commits the change, and Argo CD rolls it out
# (docs/adr/0019-image-ci-and-deploy.md). kustomize rewrites a file it edits in its own layout,
# which is why the tags live here, on their own, in that layout. To roll back, revert CI's commit
# or set an older tag here, and push.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
- name: filings-api
  newName: ghcr.io/asood8/filings-api
  newTag: 0.1.0
- name: filings-discovery
  newName: ghcr.io/asood8/filings-discovery
  newTag: 0.1.0
- name: filings-notifier
  newName: ghcr.io/asood8/filings-notifier
  newTag: 0.1.0
- name: filings-parser
  newName: ghcr.io/asood8/filings-parser
  newTag: 0.1.0
- name: filings-summarizer
  newName: ghcr.io/asood8/filings-summarizer
  newTag: 0.1.0
