# Production: the single-node k3s cluster on Oracle Cloud (arm64, 2 OCPU, 12 GB). Edit it on
# main; Argo CD syncs this directory from the production branch (deploy/argocd/filings.yaml),
# where CI's deploy job puts each pushed commit's version of it once its images are published and
# CI has passed. Render it with `kubectl kustomize deploy/k8s/overlays/production`;
# `make k8s-check` also validates it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # The SealedSecrets, one file per Secret, made with kubeseal against this cluster's key
  # (deploy/k8s/README.md; cert.pem is its public half). No smtp: email alerts are off.
  - sealed-secrets/cloudflare-analytics.yaml
  - sealed-secrets/cloudflared.yaml
  - sealed-secrets/gemini.yaml
  - sealed-secrets/grafana-cloud.yaml
  - sealed-secrets/mongodb.yaml
  - sealed-secrets/oci-inventory.yaml
  - sealed-secrets/postgres.yaml
  - sealed-secrets/r2-backups.yaml
  - sealed-secrets/r2-raw-filings.yaml
  - sealed-secrets/sec-edgar.yaml
  - sealed-secrets/unsubscribe.yaml

# The service images' registry and tags. CI sets the tags on each deploy, on the production
# branch (images/kustomization.yaml).
components:
  - images
  # The VM came up at its full size (2 OCPU, 12 GB) at launch, so the local LLM and embedding
  # servers run: no components/small-vm (docs/adr/0020).

# Replica counts for the workloads that can run more than one copy. The rest must stay at one:
# the data stores, the LLM servers, the outbox relay, and the summarizer (see each manifest).
replicas:
  - name: api
    count: 1
  - name: parser
    count: 1
  - name: notifier
    count: 1
  - name: cloudflared
    count: 1

configMapGenerator:
  - name: filings-config
    behavior: merge
    envs:
      - config.env

patches:
  # SealedSecrets are applied in the same early sync wave as the config, so each Secret exists
  # before the first pod that reads it.
  - target:
      kind: SealedSecret
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "-3"
