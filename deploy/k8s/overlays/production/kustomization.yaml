# Production: the single-node k3s cluster on Oracle Cloud (arm64, 2 OCPU, 12 GB). Argo CD syncs
# this directory from main (deploy/argocd/filings.yaml). Render it with
# `kubectl kustomize deploy/k8s/overlays/production`; `make k8s-check` also validates it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # The SealedSecrets, one file per Secret, made with kubeseal against this cluster's key
  # (deploy/k8s/README.md). Phase 7 adds them here:
  # - sealed-secrets/postgres.yaml

# The service images, built for linux/amd64 and linux/arm64 by CI and pushed to GHCR. All five
# come from the same commit and share a tag.
images:
  - name: filings-api
    newName: ghcr.io/asood8/filings-api
    newTag: "0.1.0"
  - name: filings-discovery
    newName: ghcr.io/asood8/filings-discovery
    newTag: "0.1.0"
  - name: filings-parser
    newName: ghcr.io/asood8/filings-parser
    newTag: "0.1.0"
  - name: filings-summarizer
    newName: ghcr.io/asood8/filings-summarizer
    newTag: "0.1.0"
  - name: filings-notifier
    newName: ghcr.io/asood8/filings-notifier
    newTag: "0.1.0"

# Replica counts for the workloads that can run more than one copy. The rest must stay at one:
# the data stores, the LLM servers, the outbox relay, and the summarizer (see each manifest).
replicas:
  - name: api
    count: 1
  - name: parser
    count: 1
  - name: notifier
    count: 1
  - name: cloudflared
    count: 1

configMapGenerator:
  - name: filings-config
    behavior: merge
    envs:
      - config.env

patches:
  # SealedSecrets are applied in the same early sync wave as the config, so each Secret exists
  # before the first pod that reads it.
  - target:
      kind: SealedSecret
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "-3"
