# Local development stack: `make up` / `make down`. See docs/adr/0003-local-development-stack.md.
# Ports bind to 127.0.0.1 only. Credentials come from .env (`make up` copies .env.example).
# Memory limits keep the stack near 3 GB so it fits in WSL on a 16 GB laptop.

name: sec-filings

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      # Two listeners: containers reach the broker as redpanda:9092, host processes as localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092" # Kafka API
      - "127.0.0.1:9644:9644" # Admin API (health, metrics)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1536M

  valkey:
    image: valkey/valkey:9.1.2-alpine
    # No persistence: rate-limit buckets, cache, and short-lived dedupe keys are all disposable.
    # Default noeviction policy: when full, writes fail loudly instead of silently dropping keys.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  mongodb:
    # Stand-in for MongoDB Atlas M0, which production uses. Keep the major version aligned with Atlas.
    image: mongo:8.0.34
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?copy .env.example to .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M

  # Optional local LLM for 8-K summaries: `make llm-up`. Not started by `make up`.
  ollama:
    image: ollama/ollama:0.40.0
    profiles: ["llm"]
    environment:
      # Prompts are up to ~6k tokens; Ollama's default context would silently cut them.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # The summarizer uses an LLM and an embedding model per filing; keep both loaded.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      # Ollama's llama-server keeps past prompts in RAM for reuse, up to 8 GiB by default, which
      # got the runner killed at the 5 GB limit after about 20 8-Ks. Each 8-K is a new prompt,
      # so nothing is lost without it (docs/adr/0010-local-llm-in-compose-and-default-model.md).
      LLAMA_ARG_CACHE_RAM: "0"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 5G

  # Optional local viewer for traces and metrics: `make obs-up`, then Grafana on
  # http://localhost:3001. Not started by `make up`. One container with an OpenTelemetry collector,
  # Prometheus, Tempo, Loki, Pyroscope (unused here), and Grafana, which loads our dashboards and
  # alert rules from deploy/grafana. Point the services at it with OTEL_EXPORTER_OTLP_ENDPOINT
  # (see .env.example).
  # Production uses Grafana Cloud instead. See docs/adr/0016-observability.md.
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    profiles: ["observability"]
    environment:
      # No usage reports, update checks, news feed, or plugin downloads: nothing phones home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      TEMPO_EXTRA_ARGS: "-reporting.enabled=false"
      LOKI_EXTRA_ARGS: "-reporting.enabled=false"
      PYROSCOPE_EXTRA_ARGS: "-usage-stats.enabled=false"
    ports:
      - "127.0.0.1:3001:3000" # Grafana (the website's dev server has 3000)
      - "127.0.0.1:4318:4318" # OTLP over HTTP, where the services send telemetry
      - "127.0.0.1:9090:9090" # Prometheus, to try queries directly
    volumes:
      - lgtm-data:/data
      # Grafana picks up dashboard changes within seconds; alert rules only when it starts
      # (`docker compose --profile observability restart otel-lgtm`).
      - ./deploy/grafana/dashboards:/otel-lgtm/filings-dashboards:ro
      - ./deploy/grafana/local/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/filings.yaml:ro
      - ./deploy/grafana/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  postgres-data:
  redpanda-data:
  mongodb-data:
  ollama-models:
  lgtm-data:
