[project]
name = "filings-common"
version = "0.1.0"
description = "Shared code: config, logging, event models, EDGAR client, ObjectStore, Kafka helpers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.40",
    "confluent-kafka>=2.11",
    "httpx2>=2.13",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pymongo>=4.15",
    "redis>=6",
    "sqlalchemy>=2.0.40",
]

[project.scripts]
filings-outbox-relay = "filings_common.relay:main"
filings-replay = "filings_common.replay:main"
filings-index = "filings_common.indexer:main"
filings-search-eval = "filings_common.search_eval:main"
filings-healthcheck = "filings_common.health:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
