# Workspace root. It is "virtual": not a package itself, it only ties the members
# together (one lockfile, one .venv) and holds shared tool configuration.

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.108",
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/*/src", "services/*/src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["libs", "services", "conftest.py"]
# Tests dirs have no __init__.py and share file names across packages, so module
# names are derived from paths. Each src dir is listed so package modules keep
# their import names (e.g. filings_common) instead of path-based ones.
explicit_package_bases = true
mypy_path = [
    "libs/common/src",
    "services/api/src",
    "services/discovery/src",
    "services/notifier/src",
    "services/parser/src",
    "services/summarizer/src",
]

[[tool.mypy.overrides]]
# confluent_kafka.admin re-exports classes such as NewTopic without marking them public.
module = "confluent_kafka.*"
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
# importlib mode lets each package keep its own tests/ dir with overlapping file names.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs the local stack (`make up`); skipped if unavailable unless REQUIRE_SERVICES=1",
]
