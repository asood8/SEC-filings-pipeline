[project]
name = "filings-api"
version = "0.1.0"
description = "Public read API, auth, and subscriptions (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "filings-common",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "pyjwt[crypto]>=2.15",
    "uvicorn[standard]>=0.38",
]

[tool.uv.sources]
filings-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
