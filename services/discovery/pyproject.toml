[project]
name = "filings-discovery"
version = "0.1.0"
description = "Polls EDGAR for new watchlist filings and stores them (CronJob)"
requires-python = ">=3.12"
dependencies = [
    "filings-common",
    "pypdf>=6.21.4",
]

[project.scripts]
filings-discovery = "filings_discovery.cli:main"

[tool.uv.sources]
filings-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
