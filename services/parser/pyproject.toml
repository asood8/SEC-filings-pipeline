[project]
name = "filings-parser"
version = "0.1.0"
description = "Parses raw filings by form type (Form 4, 8-K)"
requires-python = ">=3.12"
dependencies = ["filings-common"]

[project.scripts]
filings-parser = "filings_parser.cli:main"
filings-rebuild-key-fields = "filings_parser.rebuild:main"

[tool.uv.sources]
filings-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
